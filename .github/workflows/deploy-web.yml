name: Deploy Web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx expo export --platform web --output-dir dist-pages
        working-directory: app
      - run: cp dist-pages/index.html dist-pages/404.html
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
