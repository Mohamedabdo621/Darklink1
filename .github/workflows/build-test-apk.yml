name: Build test APK (debug)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-test-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Prebuild Android (fresh native project)
        working-directory: app
        run: npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish test release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-20261128-release
          name: Test APK — 28 Nov 2026 (release)
          body: |
            Test (release) build of DARKLINK for trying on a phone.
            Self-contained: the JS bundle is inside the APK, no dev server needed.
            Uninstall this build before installing the 1 Dec release APK (different signature).
          files: app/android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
