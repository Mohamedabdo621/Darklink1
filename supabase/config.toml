# إعدادات مشروع DARKLINK على Supabase
# project_id هو مرجع المشروع الحي (Darklink)
project_id = "hffnmnhyjowaqbkgnnnl"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "https://mohamedabdo621.github.io/Darklink1/"
additional_redirect_urls = ["https://mohamedabdo621.github.io/Darklink1/auth-callback", "darklink://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.delete-account]
verify_jwt = true

[functions.push-send]
verify_jwt = false

[functions.darklink-ai-chat]
verify_jwt = true
